name: Update profile art

"on":
  schedule:
    # Every three hours, not daily. GitHub delays scheduled runs under load and
    # drops them outright often enough that a once-a-day job regularly does not
    # run at all, and each miss leaves the profile showing yesterday's work for
    # another full day. Eight cheap attempts beat one that has to land.
    #
    # Eight runs is not eight commits. A run that finds nothing new writes
    # nothing and commits nothing: the fetch scripts compare everything except
    # their own timestamp and skip the write when it matches. On a day I do no
    # work, this repo should show no activity, which is the entire point of a
    # profile that reports my activity.
    - cron: "17 */3 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/fetch_contributions.py"
      - "scripts/render_heatmap_svg.py"
      - "scripts/fetch_shiplog.py"
      - "scripts/render_shiplog_svg.py"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write
  issues: write   # so a broken scrape can say so out loud

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # stdlib only, so there is nothing to pip install
      - run: python scripts/fetch_contributions.py
        env:
          GH_USER: ${{ github.repository_owner }}
      - run: python scripts/render_heatmap_svg.py
      # The ship log reads the API rather than a public HTML page, so it gets
      # the token Actions already hands us: unauthenticated works but shares a
      # 60-an-hour limit with every other runner on this IP.
      - run: python scripts/fetch_shiplog.py
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ github.token }}
      - run: python scripts/render_shiplog_svg.py
      # Committed AND authored by the bot.
      #
      # GitHub attributes a contribution to the commit's author, not its
      # committer. This action defaults the author to whoever owns the token,
      # which is me, so every refresh landed on my contribution graph as if I
      # had written it. That is not a cosmetic problem: the workflow reports my
      # streak, so it was feeding the number it reports. A quiet three-hour
      # window still produced "total 2264 -> 2265" because the previous run's
      # own commit was the contribution it had found.
      #
      # Authored by the bot, those commits stop counting, and the graph only
      # moves when I actually do something. Which then means the data only
      # changes when I actually do something, so the existing
      # write_if_changed guard stops the commit too. The honesty and the
      # quietness are the same fix.
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution heatmap [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg data/shiplog.json shiplog.svg"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

      # A scrape reads markup and an API that nobody promised would stay put.
      # When either moves, the scripts exit non-zero and the workflow goes red,
      # which nobody sees: the profile just keeps showing last week's numbers as
      # if they were today's. So say it out loud, once, in an issue.
      - name: Open an issue if the art could not be refreshed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Profile art stopped refreshing";
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                        `/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "profile-art",
            });
            // One issue, not one a day until someone notices.
            if (open.some(i => i.title === title)) {
              core.info("already reported, leaving the existing issue alone");
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ["profile-art"],
              body: [
                "The daily workflow failed, so the heatmap and the ship log on my",
                "profile are now showing stale data while looking perfectly fine.",
                "",
                `Failed run: ${url}`,
                "",
                "Usual causes:",
                "- GitHub changed the contributions page markup, so the scrape",
                "  parses zero days (`fetch_contributions.py` exits 1 under 300).",
                "- The events or repos API changed shape, so the ship log comes",
                "  back empty (`fetch_shiplog.py` exits 1).",
                "- A rate limit, which usually fixes itself by tomorrow.",
                "",
                "Run the two fetch scripts locally to see which.",
              ].join("\n"),
            });
